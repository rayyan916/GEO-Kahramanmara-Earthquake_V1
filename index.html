<!DOCTYPE html>

  <script>

        extend: {
          colors: {

  <style>
    /* Custom styles for cozy miniature toy city feel */
    body {
      background-color: #F7F4EF;
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    #webgl-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.03);
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.18);
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0,0,0,0.3);
    }

    /* Glassmorphism overlays */
    .glass-panel {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    /* Range slider custom styling */
    input[type=range] {
      -webkit-appearance: none;
      background: #E5E7EB;
      height: 8px;
      border-radius: 4px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 22px;
      width: 22px;
      border-radius: 50%;
      background: #E76F51;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: transform 0.1s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    /* Pulse beacon effect */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pulse-effect {
      animation: pulse-ring 2s infinite ease-in-out;
    }

    /* Drawer sliding for mobile & desktop */
    .drawer-transition {
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>

  <!-- SCRIPT LOGIC -->
  <script>
    // Global State
    let scene, camera, renderer, controls;
    let islandGroup = new THREE.Group();
    let islands = [];
    let activeIslandIndex = 0;
    let audioEnabled = true;
    let audioCtx = null;
    let isQuaking = false;
    let earthquakeTime = 0;
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();

    // Data corresponding to rainbow force Catholic English College Geography Worksheet
    const studyData = {
      sectionA: {
        title: "A. 資料搜集：土耳其地震 (2023年)",

        tectonics: "位於安納托利亞板塊、阿拉伯板塊與非洲板塊交界處；屬於保育型板塊邊界 (Conservative Boundary)；發生於【東安納托利亞斷層 (East Anatolian Fault)】，屬於【左旋平移斷層 (Left-lateral Strike-slip Fault)】",
        frequency: "極為頻密。土耳其位於死海斷層與安納托利亞斷層帶，為全球地震最活躍國家之一 (如1999年伊茲密特 7.6 級地震)",
        deaths: "土耳其 > 53,537 人 (連同敘利亞合計超過 59,500 人)",
        injured: "超過 107,213 人",
        homeless: "約 300 萬人以上撤離無家可歸",
        missing: "逾 140+ 人官方通報失蹤",
        buildings: "超過 160,000 幢建築物倒塌或嚴重受損需拆除 (約 520,000 套住宅單位)，出現大量「鬆餅式倒塌」",
        infrastructure: "哈塔伊機場跑道斷裂關閉、多條主要跨省高速公路龜裂、電力高壓電網與天然氣管線破裂中斷",
        otherImpacts: "經濟損失超過 1,500 億美元 (約占土耳其 GDP 9%)；千禧古蹟加濟安泰普城堡及 180 年歷史耶尼清真寺塌毀"
      },
      sectionB: {
        title: "B. 資料搜集：土耳其的社會經濟資料",
        sub: "評估災害防禦力與脆弱性 (Vulnerability)",
        economic: "中高收入國家，但受災區域 (南部省份) 人均 GDP 較低，且地震前夕正面臨高達 80% 的高通膨與貨幣貶值，復原與備災資金受限。",
        transport: "公路與鐵路網絡密集，但因山泥傾瀉與道路龜裂造成救援早期交通癱瘓；哈塔伊機場跑道受損延誤國際救援物資抵達。",
        buildingCode: "雖然 1999 年後訂有嚴格耐震建築法規，但政府於 2018 年頒佈「建築特赦 (Zoning Amnesties)」，准許超過 700 萬違規建築繳費補辦合法化，未實質補強結構；大量建築存在偷工減料與底樓改建砍斷承重柱 (Soft-story 軟層) 問題。",
        government: "土耳其災害管理局 (AFAD) 在地震初期的物資調配與重型搜救機械調配出現瓶頸；加上暴風雪天氣，初期救援反應速度遭受批評。",
        popEducation: "受災區人口密度高，包含超過 150 萬名敘利亞難民；大眾避難教育與日常防禦演練不足，夜間 04:17 發生時反應時間極短。"
      },
      sectionC: {
        title: "C. 討論：災情是主要因為當地社會經濟因素導致嗎？",
        sub: "DSE 高中地理專題評析與立場論述",
        question: "土耳其地震的災情是主要因為當地社會經濟因素導致嗎？",
        naturalScore: 50,
        humanScore: 50
      }
    };

    // User Interactive Input Worksheet State
    let studentAnswers = {
      date: "",
      epicenter: "",
      magnitude: "",
      depth: "",
      tectonics: "",
      deaths: "",
      buildings: "",
      economic: "",
      buildingCode: "",
      stance: "mixed",
      reason: ""
    };

    // Preset Student Peer Comments
    let peerComments = [
      { name: "陳同學 (S4B)", time: "10分鐘前", text: "我覺得建築特赦肯定是主因！違規建築底樓被砍掉承重柱，地震來時像鬆餅一樣倒下來。", stance: "人為因素為主" },
      { name: "張同學 (S5A)", time: "25分鐘前", text: "但不能忽視天然因素，7.8 級震級太大了，而且震源深度只有 10 公里，加上凌晨 4 點大家都在睡覺。", stance: "自然因素為主" },
      { name: "李老師 (地理科)", time: "1小時前", text: "同學分析得很好！DSE 5** 的答題策略是要將『自然危害的破壞力』與『社經因素帶來的脆弱性』進行綜合比較！", stance: "綜合分析" }
    ];

    // Initialize 3D Scene
    window.onload = function() {
      initThree();
      buildIslands();
      renderDrawerContent(0);
      animate();
      showToast("歡迎登島！點擊 3D 模型小島或選單開始學習探究");
    };

    function initThree() {
      const container = document.getElementById('webgl-container');
      
      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color('#F7F4EF');
      scene.fog = new THREE.FogExp2('#F7F4EF', 0.015);

      // Camera
      camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 22, 32);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // Controls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2.15;
      controls.minDistance = 10;
      controls.maxDistance = 55;
      controls.target.set(0, 0, 0);

      // Lighting - Warm Toy Miniature Palette
      const ambientLight = new THREE.AmbientLight('#FFEAD0', 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight('#FFF5E6', 1.2);
      dirLight.position.set(20, 35, 15);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.camera.near = 0.5;
      dirLight.shadow.camera.far = 80;
      const d = 25;
      dirLight.shadow.camera.left = -d;
      dirLight.shadow.camera.right = d;
      dirLight.shadow.camera.top = d;
      dirLight.shadow.camera.bottom = -d;
      scene.add(dirLight);

      const hemiLight = new THREE.HemisphereLight('#FFFFFF', '#8D6E63', 0.4);
      scene.add(hemiLight);

      scene.add(islandGroup);

      // Event Listeners
      window.addEventListener('resize', onWindowResize);
      renderer.domElement.addEventListener('pointerdown', onPointerDown);
    }

    // Create Extruded Hexagon Base
    function createHexGeometry(radius, height) {
      const shape = new THREE.Shape();
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i;
        const x = radius * Math.cos(angle);
        const z = radius * Math.sin(angle);
        if (i === 0) shape.moveTo(x, z);
        else shape.lineTo(x, z);
      }
      const extrudeSettings = {
        depth: height,
        bevelEnabled: true,
        bevelSegments: 3,
        steps: 1,
        bevelSize: 0.2,
        bevelThickness: 0.2
      };
      const geom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geom.rotateX(Math.PI / 2);
      return geom;
    }

    // Build the 5 Toy Hexagonal Islands
    function buildIslands() {
      const islandConfigs = [
        { id: 0, name: "板塊震央島", pos: [-8, 0, 3], color: 0xE76F51, icon: "volcano" },
        { id: 1, name: "災情破壞島", pos: [8, 0, 3], color: 0xD9534F, icon: "building-circle-xmark" },
        { id: 2, name: "社經建築島", pos: [0, 0, -8], color: 0xE9C46A, icon: "building-user" },
        { id: 3, name: "辯論天秤島", pos: [-8, 0, -6], color: 0x2A9D8F, icon: "scale-balanced" },
        { id: 4, name: "線上工作紙島", pos: [0, 0, 3], color: 0x264653, icon: "pen-to-square" }
      ];

      islandConfigs.forEach((cfg) => {
        const islandContainer = new THREE.Group();
        islandContainer.position.set(cfg.pos[0], cfg.pos[1], cfg.pos[2]);

        // Base Hexagon Tile
        const hexGeom = createHexGeometry(4.2, 1.2);
        const hexMat = new THREE.MeshStandardMaterial({
          color: cfg.color,
          roughness: 0.4,
          metalness: 0.1
        });
        const hexMesh = new THREE.Mesh(hexGeom, hexMat);
        hexMesh.receiveShadow = true;
        hexMesh.castShadow = true;
        hexMesh.userData = { islandId: cfg.id };
        islandContainer.add(hexMesh);

        // Decorate Island specific features
        decorateIsland(islandContainer, cfg.id);

        islandGroup.add(islandContainer);
        islands.push({ group: islandContainer, mesh: hexMesh, config: cfg });
      });
    }

    // Add 3D Toy Details to each island
    function decorateIsland(container, id) {
      if (id === 0) {
        // Tectonics Island: Red fault line split + Epicenter pulsing beacon
        const faultGeom = new THREE.BoxGeometry(0.3, 0.4, 7);
        const faultMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const fault = new THREE.Mesh(faultGeom, faultMat);
        fault.position.set(0, 0.7, 0);
        container.add(fault);

        // Epicenter Red Beacon
        const beaconGeom = new THREE.CylinderGeometry(0.4, 0.6, 1.5, 12);
        const beaconMat = new THREE.MeshStandardMaterial({ color: 0xFF0000, emissive: 0x990000 });
        const beacon = new THREE.Mesh(beaconGeom, beaconMat);
        beacon.position.set(-1, 1.2, 0);
        beacon.castShadow = true;
        container.add(beacon);

        // Arrow indicators for strike-slip motion
        const arrow1 = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.8, 8), new THREE.MeshStandardMaterial({ color: 0xFFD166 }));
        arrow1.rotation.z = -Math.PI / 2;
        arrow1.position.set(-1.2, 0.8, 2);
        container.add(arrow1);

        const arrow2 = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.8, 8), new THREE.MeshStandardMaterial({ color: 0xFFD166 }));
        arrow2.rotation.z = Math.PI / 2;

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);

      // Orbit controls update
      controls.update();

      // Idle float & rotational animations
      const time = Date.now() * 0.0015;

      // Globe rotation on Island 4
      const globe = scene.getObjectByName("miniGlobe");
      if (globe) globe.rotation.y += 0.01;

      // Quake simulation effect
      if (isQuaking) {
        earthquakeTime += 0.1;
        islandGroup.position.x = Math.sin(earthquakeTime * 8) * 0.25;
        islandGroup.position.z = Math.cos(earthquakeTime * 9) * 0.25;
      } else {
        islandGroup.position.set(0, 0, 0);
      }

      renderer.render(scene, camera);
    }

    // Pointer event raycasting to select islands
    function onPointerDown(event) {
      // Prevent click triggering if clicking UI elements
      if (event.clientX > window.innerWidth - 300 && window.innerWidth > 768) return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(islandGroup.children, true);

      if (intersects.length > 0) {
        let current = intersects[0].object;
        while (current && current.userData.islandId === undefined && current.parent) {
          current = current.parent;
        }
        if (current && current.userData && current.userData.islandId !== undefined) {
          playAudioTone(520, 'sine', 0.1);
          switchIsland(current.userData.islandId);
        }
      }
    }

    // Switch active island and focus camera
    function switchIsland(index) {
      activeIslandIndex = index;

      // Update Pill Highlights
      document.querySelectorAll('.island-pill').forEach((pill, idx) => {
        if (idx === index) {
          pill.className = "island-pill px-3 py-2 rounded-xl text-xs md:text-sm font-bold flex items-center gap-2 transition bg-orange-500 text-white shadow-sm";
        } else {
          pill.className = "island-pill px-3 py-2 rounded-xl text-xs md:text-sm font-bold flex items-center gap-2 transition text-slate-600 hover:bg-slate-100";
        }
      });

      // Target Coordinates for camera lerp focus
      const targetPos = islands[index].config.pos;
      
      // Smooth Camera Animation via GSAP style tween
      const startTarget = controls.target.clone();
      const endTarget = new THREE.Vector3(targetPos[0], 0, targetPos[2]);
      
      let progress = 0;
      function moveStep() {
        progress += 0.08;
        controls.target.lerpVectors(startTarget, endTarget, Math.min(progress, 1));
        if (progress < 1) requestAnimationFrame(moveStep);
      }
      moveStep();

      // Render drawer tab content
      renderDrawerContent(index);

      // On Mobile: Open drawer if closed
      const drawer = document.getElementById('mainDrawer');
      if (window.innerWidth < 768) {
        drawer.classList.remove('translate-x-full');
      }

      playAudioTone(440 + index * 80, 'triangle', 0.12);
    }

      controls.target.set(0, 0, 0);
      camera.position.set(0, 22, 32);

                <textarea id="inputImpacts" rows="2" class="w-full p-2 rounded-xl border border-slate-200 bg-slate-50" placeholder="例如: 超過16萬幢建築倒塌、鬆餅式坍塌、機場跑道斷裂"></textarea>
              </div>
            </div>

            <hr class="border-slate-100">

            <div class="space-y-3">
              <h4 class="font-bold text-slate-800 text-xs text-amber-600"><i class="fa-solid fa-comments"></i> C. 組別立場與討論</h4>
              
              <div>
                <label class="font-medium text-slate-700 block mb-1">你組別的立場：</label>
                <select id="inputStance" class="w-full p-2.5 rounded-xl border border-slate-200 bg-slate-50 font-bold text-slate-800">
                  <option value="human">主要為社會經濟因素導致 (人為)</option>
                  <option value="natural">主要為自然危害因素導致 (自然)</option>
                  <option value="mixed" selected>自然因素與社會經濟因素共同作用 (綜合)</option>
                </select>
              </div>

              <div>
                <label class="font-medium text-slate-700 block mb-1">論述原因 (Reasons)：</label>
                <textarea id="inputReason" rows="3" class="w-full p-2 rounded-xl border border-slate-200 bg-slate-50" placeholder="請詳細列出原因，例如：建築特赦導致違規結構崩塌，加上7.8強震極淺層震源..."></textarea>
              </div>
            </div>

            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
              <i class="fa-solid fa-file-arrow-down"></i> 提交工作紙並導出筆記
            </button>
          </form>

          <!-- Peer Live Chat Simulator -->
          <div class="mt-6 pt-4 border-t border-slate-200 space-y-3">
            <h4 class="font-bold text-xs text-slate-800 flex items-center justify-between">
              <span><i class="fa-solid fa-users text-teal-600 mr-1"></i> 島民即時研討論壇</span>
              <span class="text-slate-400 font-normal">3 位同學在線</span>
            </h4>

            <div id="commentsContainer" class="space-y-2">
              ${peerComments.map(c => `
                <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200/80 text-xs">
                  <div class="flex items-center justify-between mb-1">
                    <strong class="text-slate-800">${c.name}</strong>
                    <span class="text-slate-400 text-[10px]">${c.time}</span>
                  </div>
                  <p class="text-slate-600">${c.text}</p>
                  <span class="inline-block mt-1 text-[10px] bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full font-semibold">${c.stance}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
    }

    // Toggle 3D Earthquake Shaking Simulation
    function toggleEarthquakeSim() {
      isQuaking = !isQuaking;
      const btn = document.getElementById('quakeSimBtn');

      if (isQuaking) {
        btn.className = "pointer-events-auto bg-red-600 text-white font-bold px-3.5 py-2.5 rounded-xl shadow-lg transition flex items-center gap-2 text-xs md:text-sm animate-bounce";
        btn.innerHTML = `<i class="fa-solid fa-volcano"></i> 停止地震模擬`;
        showToast("⚠️ 模擬發動：Mw 7.8 地震強烈震動中！");
        playEarthquakeRumble();
      } else {
        btn.className = "pointer-events-auto glass-panel hover:bg-orange-500 hover:text-white text-slate-700 font-bold px-3.5 py-2.5 rounded-xl shadow-md transition flex items-center gap-2 text-xs md:text-sm";
        btn.innerHTML = `<i class="fa-solid fa-house-crack text-orange-500 hover:text-white"></i> <span class="hidden sm:inline">觸發地震模擬</span>`;
        showToast("地震模擬結束，板塊恢復穩定");
      }
    }

    // Update Debate Scale Tilt Animation
    function updateDebateScale(val) {
      const natVal = 100 - val;
      const humVal = val;
      document.getElementById('natPercent').innerText = `${natVal}% 自然比重`;
      document.getElementById('humPercent').innerText = `${humVal}% 社經比重`;

      // Tilt Beam in 3D
      const beam = scene.getObjectByName("scaleBeam");
      if (beam) {
        const angle = ((val - 50) / 50) * 0.35; // Tilt range
        beam.rotation.z = angle;
      }
    }

    // Auto Fill Reference Answer Key from PDF
    function autoFillCorrectData() {
      document.getElementById('stuName').value = "彩虹天主教中學 學生";
      document.getElementById('stuClass').value = "S.4B (08)";
      document.getElementById('inputDate').value = studyData.sectionA.date;
      document.getElementById('inputTectonics').value = studyData.sectionA.tectonics;
      document.getElementById('inputImpacts').value = studyData.sectionA.buildings + "；" + studyData.sectionA.infrastructure;
      document.getElementById('inputStance').value = "mixed";
      document.getElementById('inputReason').value = "土耳其地震為極淺層 Mw 7.8 強震（自然危害高），但 2018 年政府頒佈『建築特赦』導致大量違規低劣建築倒塌，將自然災害推演為巨大人造浩劫。";

      showToast("✨ 已填入彩虹天主教中學地理科標準參考答案！");
      playAudioTone(600, 'sine', 0.15);
    }

    // Submit Worksheet & Export Study Notes
    function submitWorksheet() {
      const name = document.getElementById('stuName').value || "無名學生";
      const cls = document.getElementById('stuClass').value || "S.4";
      const reason = document.getElementById('inputReason').value || "未填寫";

      const textData = `
========================================
彩虹邨天主教英文中學 高中地理科工作紙溫習筆記

========================================

班別座號：${cls}

    // Copy Essay Template
    function copyDseTemplate() {
      const essay = document.getElementById('dseEssayOutput').innerText;
      const el = document.createElement('textarea');
      el.value = essay;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      showToast("📋 已複製 DSE 5** 高分範本至剪貼簿");
      playAudioTone(650, 'sine', 0.1);
    }

    // Web Audio API Audio Synthesizer (No External Files)
    function playAudioTone(freq, type, duration) {
      if (!audioEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playEarthquakeRumble() {
      if (!audioEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(60, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 1.2);
      } catch (e) {}
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      const btn = document.getElementById('audioBtn');
      if (audioEnabled) {
        btn.innerHTML = `<i class="fa-solid fa-volume-high text-sm text-slate-700"></i>`;
        showToast("音效已開啟");
      } else {
        btn.innerHTML = `<i class="fa-solid fa-volume-xmark text-sm text-slate-400"></i>`;
        showToast("音效已靜音");
      }
    }

    // Toggle Drawer Visibility on Mobile
    function toggleDrawer() {
      const drawer = document.getElementById('mainDrawer');
      drawer.classList.toggle('translate-x-full');
    }

    // Toast Notification System
    function showToast(msg) {
      const toast = document.getElementById('toastBox');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');

      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 3200);
    }

    // Window Resize Handler
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
